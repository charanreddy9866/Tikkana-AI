# Render Blueprint for the FastAPI backend.
# Render dashboard → New → Blueprint → pick this repo. You'll be asked for OPENAI_API_KEY.
services:
  - type: web
    name: tikkana-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000
